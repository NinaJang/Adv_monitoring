# ==========================================================
#  기관명 도용 홍보 게시물 모니터링 설정
#  이 파일만 수정하면 됩니다. (변경 후 커밋/푸시)
# ==========================================================

# 반드시 포함돼야 하는 단어 (업체명).
# 제목·요약·작성자·URL 어디에도 이 단어가 없으면 기록하지 않습니다.
# 기관은 해당 업체를 공식적으로 홍보하지 않으므로, 기관명이 함께 나오는 게시물은 모두 도용 의심 대상입니다.
required_words:
  - 라스북

# 기관 이름. 게시물에 함께 나오면 +5점이고, 리포트의 '기관명' 칸에 ✅로 표시됩니다.
keywords:
  - 국립중앙과학관
  - 중앙과학관
  - 대전 과학관      # 띄어쓰기 무시: "대전과학관"도 매칭
  - 국립과학관

# 실제로 검색할 검색어 (네이버, Brave 모두 사용)
queries:
  - 라스북 국립중앙과학관
  - 라스북 중앙과학관
  - 라스북 대전 과학관
  - 라스북 국립과학관
  - 라스북 과학관
  - 라스북           # 요약문에 기관명이 안 보이는 게시물도 놓치지 않도록 업체명 단독 검색

# 기관과의 공식 관계를 주장하는 표현. 포함되면 +3점
claim_words:
  - 입점
  - 공식
  - 인증
  - 지정
  - 협약
  - 제휴
  - 선정
  - 납품
  - 공급
  - 추천도서

# 리포트(reports/*.md)에 표시할 최소 점수. 0이면 라스북 게시물을 모두 표시합니다.
report_min_score: 0

# 일반 홍보성 단어. 하나당 +1점
promo_words:
  - 광고
  - 협찬
  - 체험단
  - 원고료
  - 소정의
  - 제공받아
  - 이벤트
  - 할인
  - 특가
  - 프로모션
  - 예약
  - 상담
  - 문의
  - 가격
  - 비용
  - 업체
  - 시공
  - 추천
  - 독점
  - 카톡
  - 오픈채팅
  - DM
  - 구매
  - 판매
  - 쇼핑
  - 스토어

# 결과에서 제외할 사이트 (기관 공식 홈페이지, 공식 블로그/SNS 등)
# URL에 아래 문자열이 포함되면 기록하지 않습니다.
exclude_url_contains:
  # - "blog.naver.com/기관공식블로그ID"
  # - "instagram.com/기관공식계정"
  - "science.go.kr"        # 국립중앙과학관 공식 홈페이지

# 제목/요약에 아래 단어가 있으면 제외 (예: 동명의 다른 단체, 무관한 뉴스 등)
exclude_text_contains: []

sources:
  # ---- 네이버 검색 Open API (블로그 / 카페) ----
  # GitHub Secrets: NAVER_CLIENT_ID, NAVER_CLIENT_SECRET
  naver:
    enabled: true
    types: [blog, cafearticle]
    pages: 3              # 키워드 x 유형별로 최신순 100건씩 최대 몇 페이지 조회할지 (최대 10)

  # ---- Brave Search API (구글 대체 웹 검색 + SNS) ----
  # GitHub Secret: BRAVE_API_KEY
  # 구글 Custom Search API는 신규 가입이 막혀 있고 2027-01-01 종료 예정이라 Brave를 사용합니다.
  brave:
    enabled: true
    freshness: pm         # pd=24시간, pw=1주, pm=1개월, py=1년
    pages: 1              # 쿼리당 20건씩 몇 페이지 조회할지 (최대 10)
    # 호출량 = 검색어 수 x (웹 1 + sites 수) x 페이지. 무료 크레딧(월 약 1,000회)에 맞춰 조절하세요.
    # Brave에서 쓸 검색어 (비워두면 위 queries 전체 사용). 4개 x 7곳 = 하루 28회, 월 약 840회
    queries:
      - 라스북 국립중앙과학관
      - 라스북 대전 과학관
      - 라스북 국립과학관
      - 라스북
    web_search: true      # 사이트 제한 없는 일반 웹 검색
    # 아래 사이트 각각에 대해 site: 검색을 추가로 수행 (SNS 모니터링용)
    sites:
      - instagram.com
      - facebook.com
      - youtube.com
      - threads.net
      - x.com
      - tistory.com
