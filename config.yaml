# ==========================================================
#  기관명 도용 홍보 게시물 모니터링 설정
#  이 파일만 수정하면 됩니다. (변경 후 커밋/푸시)
# ==========================================================

# 검색할 기관 이름. 정식 명칭, 약칭, 영문명 등을 모두 적어 주세요.
keywords:
  - "국립중앙과학관"
  # 약칭/영문명이 홍보에 쓰이면 추가하세요. 예) "중앙과학관", "National Science Museum"

# 기관명 단독 검색 외에 추가로 돌릴 검색어.
# "국립중앙과학관"만으로 검색하면 관람 후기 등이 너무 많이 섞이므로,
# 업체명/공식 주장 표현과 묶은 검색어로 문제 게시물을 놓치지 않게 합니다.
extra_queries:
  - "국립중앙과학관 라스북"
  - "국립중앙과학관 입점"
  - "국립중앙과학관 공식 입점"
  - "국립중앙과학관 인증"

# 관심 업체 (이미 확인된 업체). 포함되면 +5점
watch_companies:
  - 라스북

# 기관과의 공식 관계를 주장하는 표현. 포함되면 +3점
claim_words:
  - 입점
  - 공식
  - 인증
  - 지정
  - 협약
  - 제휴
  - 선정
  - 납품
  - 공급
  - 추천도서
  - 기념품
  - 굿즈

# 리포트(reports/*.md)에는 이 점수 이상인 게시물만 표시합니다.
# 점수가 낮은 일반 관람 후기 등도 data/posts.csv 에는 모두 기록됩니다.
# 3 = 공식 주장 표현이 1개 이상 있거나, 홍보 단어가 3개 이상
report_min_score: 3

# 키워드가 제목/본문 요약에 실제로 들어있는 결과만 남길지 여부
# (검색엔진이 비슷한 단어로 넓게 검색한 결과를 걸러냅니다)
require_keyword_match: true

# 일반 홍보성 단어. 하나당 +1점
promo_words:
  - 광고
  - 협찬
  - 체험단
  - 원고료
  - 소정의
  - 제공받아
  - 이벤트
  - 할인
  - 특가
  - 프로모션
  - 예약
  - 상담
  - 문의
  - 가격
  - 비용
  - 업체
  - 시공
  - 추천
  - 독점
  - 카톡
  - 오픈채팅
  - DM
  - 구매
  - 판매
  - 쇼핑
  - 스토어

# 결과에서 제외할 사이트 (기관 공식 홈페이지, 공식 블로그/SNS 등)
# URL에 아래 문자열이 포함되면 기록하지 않습니다.
exclude_url_contains:
  # - "blog.naver.com/기관공식블로그ID"
  # - "instagram.com/기관공식계정"
  - "science.go.kr"        # 국립중앙과학관 공식 홈페이지

# 제목/요약에 아래 단어가 있으면 제외 (예: 동명의 다른 단체, 무관한 뉴스 등)
exclude_text_contains: []

sources:
  # ---- 네이버 검색 Open API (블로그 / 카페) ----
  # GitHub Secrets: NAVER_CLIENT_ID, NAVER_CLIENT_SECRET
  naver:
    enabled: true
    types: [blog, cafearticle]
    pages: 3              # 키워드 x 유형별로 최신순 100건씩 최대 몇 페이지 조회할지 (최대 10)

  # ---- Brave Search API (구글 대체 웹 검색 + SNS) ----
  # GitHub Secret: BRAVE_API_KEY
  # 구글 Custom Search API는 신규 가입이 막혀 있고 2027-01-01 종료 예정이라 Brave를 사용합니다.
  brave:
    enabled: true
    freshness: pm         # pd=24시간, pw=1주, pm=1개월, py=1년
    pages: 2              # 쿼리당 20건씩 몇 페이지 조회할지 (최대 10)
    # extra_queries 도 Brave로 검색할지. 켜면 호출량이 쿼리 수만큼 늘어나
    # 무료 크레딧(월 약 1,000회)을 넘을 수 있습니다. 기본은 기관명(keywords)만 검색.
    use_extra_queries: false
    web_search: true      # 사이트 제한 없는 일반 웹 검색
    # 아래 사이트 각각에 대해 site: 검색을 추가로 수행 (SNS 모니터링용)
    sites:
      - instagram.com
      - facebook.com
      - youtube.com
      - threads.net
      - x.com
      - tistory.com
